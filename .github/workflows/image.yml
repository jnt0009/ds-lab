# Builds the NSF image for amd64 (battlestation, GCP) on a native x86 runner, smoke-tests it, and pushes it to
# Artifact Registry in house-282504: us-east1-docker.pkg.dev/house-282504/nsf/nsf:<commit> and :latest.
# No key is stored anywhere: GitHub's OIDC token is exchanged for the nsf-builder service account, which only this repo's
# main branch may use (Workload Identity Federation) and which can only write to the nsf repository.
# The Mac builds its own arm64 copy from the same Dockerfile and locks (README).
name: image
on:
  push:
    branches: [main]
    paths: [Dockerfile, "docker/**", "r/**", "python/**", "templates/**", "tests/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-east1-docker.pkg.dev/house-282504/nsf/nsf

jobs:
  amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Make room (the image is ~8 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        id: gcp
        with:
          workload_identity_provider: projects/1058500405108/locations/global/workloadIdentityPools/github/providers/ds-lab
          service_account: nsf-builder@house-282504.iam.gserviceaccount.com
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nsf:ci
      - name: Smoke test
        run: docker run --rm --entrypoint /opt/nsf/smoke.sh nsf:ci
      - name: Push
        run: |
          short=$(git rev-parse --short=12 HEAD)
          for tag in "$short" latest; do docker tag nsf:ci "$IMAGE:$tag" && docker push -q "$IMAGE:$tag"; done
          echo "pushed $IMAGE:$short and :latest" >> "$GITHUB_STEP_SUMMARY"
